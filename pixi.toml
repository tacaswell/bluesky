[workspace]
authors = ["thomashopkins32 <thopkins1@bnl.gov>"]
channels = ["conda-forge"]
name = "bluesky"
platforms = ["linux-64"]
version = "1.15.1"
preview = ["pixi-build"]

# ── Package (pixi-build entry point) ────────────────────────────────────────
# With pixi-build, `pixi install` performs an editable install by default.

[package]
name = "bluesky-base"
version = "1.15.1"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
# bluesky is a pure-Python package; build a noarch conda package
noarch = true

[package.host-dependencies]
# build-system declared in pyproject.toml
setuptools = ">=64"
setuptools_scm = ">=8"

# ── Default / shared dependencies ───────────────────────────────────────────

[dependencies]
# source install of bluesky from this checkout via the [package] section above;
# pixi install performs an editable install by default
bluesky-base = { path = "." }
graphviz = ">=14.1.2,<15"

# ── Test feature ─────────────────────────────────────────────────────────────

[feature.test.dependencies]
# test runners
pytest = "*"
pytest-cov = "*"
pytest-faulthandler = "*"
pytest-mock = ">=3.15.1"
coverage = "*"
# test dependencies — all from conda-forge
attrs = "*"
bluesky-tiled-plugins = ">=2.0.9"
cloudpickle = "*"
colorama = "*"
cycler = "*"
databroker = "*"
doct = "*"
event-model = ">=1.23.1"
historydict = "*"
ipython = "*"
ipywidgets = "*"
jinja2 = "*"
lmfit = "*"
matplotlib-base = ">=3.5.0"
mongoquery = "*"
mongomock = "*"
msgpack-numpy = "*"
msgpack-python = "*"
multiprocess = "*"
mypy = "*"
networkx = "*"
numpy = "*"
ophyd = "*"
opentelemetry-api = "*"
opentelemetry-sdk = "*"
orjson = "*"
packaging = "*"
pandas = "*"
pickleshare = "*"
pyside6 = "*"
pyzmq = "*"
pyyaml = "*"
requests = "*"
scikit-image = "*"
scipy = "*"
streamz = "*"
suitcase-jsonl = "*"
suitcase-mongo = "*"
suitcase-msgpack = "*"
tifffile = "*"
tiled-client = "*"
toolz = "*"
tqdm = ">=4.44"
types-mock = "*"
typing_extensions = ">=4.10.0"
zict = "*"

[feature.test.tasks]
test = "pytest --cov=bluesky --cov-report=term --cov-report=xml:cov.xml"

# ── Lint feature ──────────────────────────────────────────────────────────────

[feature.lint.dependencies]
pre-commit = "*"
ruff = "*"

[feature.lint.tasks]
lint = "pre-commit run --all-files --show-diff-on-failure"

# ── Type-checking feature ─────────────────────────────────────────────────────

[feature.typecheck.dependencies]
mypy = "*"
types-mock = "*"

[feature.typecheck.tasks]
typecheck = "mypy src"

# ── Docs feature ─────────────────────────────────────────────────────────────

[feature.docs.dependencies]
myst-parser = "*"
numpydoc = "*"
pydata-sphinx-theme = ">=0.12"
sphinx = "<7.3"
sphinx-autobuild = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinxcontrib-mermaid = "*"
sphinx-rtd-theme = "*"

[feature.docs.tasks]
docs = "sphinx-build -EW --keep-going -T docs build/html"
docs-live = "sphinx-autobuild -T docs build/html"

# ── Python-version features ───────────────────────────────────────────────────

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

# ── Environments ──────────────────────────────────────────────────────────────

[environments]
py313 = { features = ["py313", "test"], solve-group = "py313" }
py314 = { features = ["py314", "test"], solve-group = "py314" }
lint = { features = ["lint"], no-default-feature = true }
typecheck = { features = ["py313", "typecheck", "test"], solve-group = "py313" }
docs = { features = ["py313", "docs"], solve-group = "py313" }
